name: Pipeline diario — Alerta térmica municipal

on:
  workflow_dispatch:        # permite lanzarlo a mano desde la pestaña Actions
  schedule:
    - cron: "0 5 * * *"     # 05:00 UTC todos los días

permissions:
  contents: write            # mínimo necesario: solo para poder hacer commit/push

concurrency:
  group: pipeline-diario
  cancel-in-progress: false  # si ya hay una ejecución en curso, no se cancela, se espera

jobs:
  ejecutar-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar tests (no continuar si algo está roto)
        run: pytest tests/ -v

      - name: Ejecutar pipeline completo
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: python -m src.pipeline

      - name: Commit y push de los datos actualizados (solo si hay cambios)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/staging data/trusted
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos — no se hace commit."
          else
            git commit -m "Actualización automática del pipeline diario ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
